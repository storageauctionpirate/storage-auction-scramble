<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f59e0b"><meta name="apple-mobile-web-app-title" content="Storage Scramble"><link rel="icon" href="data:,"><title>Storage Auction Scramble</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#140c05;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);
background:linear-gradient(90deg,#0006,transparent 6%,transparent 94%,#0006),repeating-linear-gradient(180deg,#ffb21a 0,#ffcf3f 10px,#f59e0b 20px,#b86e00 24px,#5a3500 26px);border-left:10px solid #222;border-right:10px solid #222}
#hud{display:flex;justify-content:space-between;font-weight:900;gap:6px}.pill{background:#000c;border:2px solid #111;color:#ffd23f;border-radius:20px;padding:6px 12px;font-size:15px}
#mute{background:#000c;border:2px solid #111;border-radius:20px;font-size:18px;padding:2px 10px}
#scr{flex:1;margin-top:8px;background:#0b0603e6;border:3px solid #111;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;overflow:hidden}
h1 small{display:block;font-size:22px;letter-spacing:2px;line-height:1.2;margin-bottom:6px;text-shadow:2px 2px 0 #c2410c,4px 4px 0 #000}h1{font-size:58px;line-height:.9;color:#ffd23f;text-shadow:4px 4px 0 #c2410c,8px 8px 0 #000;transform:rotate(-3deg)}
.sub{font-size:16px;opacity:.9}.big{font-size:44px;font-weight:900;color:#ffd23f;text-shadow:3px 3px 0 #000}
.btn{font-family:inherit;font-weight:900;font-size:24px;border:none;border-radius:18px;padding:18px 30px;background:#ffd23f;color:#1a0f2e;box-shadow:0 6px 0 #b8860b;min-width:210px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
.box{background:#000a;border:2px solid #ffb21a;border-radius:14px;padding:12px;width:100%;font-size:16px;line-height:1.6;text-align:left}
.lockd{font-size:60px}.red{color:#ff4757}.thumbs{display:flex;gap:4px}.thumbs img{width:52px;height:52px;border-radius:6px;border:2px solid #111;filter:brightness(.5)}
.pz{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.pzbar{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:900;gap:6px}
.pzt{font-size:30px;color:#ffd23f;text-shadow:2px 2px 0 #000;min-width:80px;font-variant-numeric:tabular-nums}.pzt.hot{color:#ff4757;animation:pzp .5s infinite}
.pzinfo{white-space:nowrap;font-size:13px;background:#000a;border:2px solid #ffb21a;border-radius:10px;padding:4px 8px;color:#fff}
.pzb{position:relative;background:#1b1206;border:5px solid #111;border-radius:8px;box-shadow:0 0 0 3px #ffb21a,0 8px 0 #0008;touch-action:none;overflow:hidden}
.pzg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .15s;z-index:3;pointer-events:none}.pzb.peek .pzg{opacity:.45}
.pzc{position:absolute;border-radius:4px;transition:left .11s ease-out,top .11s ease-out;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px #0009;display:flex;align-items:center;justify-content:center;font-weight:900;color:#ffcf3f;text-shadow:1px 1px 0 #000;cursor:pointer}
.pzc.cov{background:repeating-linear-gradient(90deg,#5a3a14 0 6px,#6e4718 6px 12px,#4a2f0f 12px 13px)!important;border:2px solid #2b1a06;box-shadow:inset 0 0 0 2px #8a5a1e!important}
.pzc.cov::before,.pzc.cov::after{content:"";position:absolute;left:8%;right:8%;height:12%;background:#3a2509;top:12%}.pzc.cov::after{top:auto;bottom:12%}
.pzc span{position:relative;z-index:1}.pzc.ok{box-shadow:inset 0 0 0 2px #2ed57399}.pzc.pop{animation:pzpop .3s}
.pzrow{display:flex;gap:8px;width:100%;justify-content:center}
.pzbtn{font-family:inherit;font-weight:900;font-size:18px;border:none;border-radius:14px;padding:12px 16px;background:#ffd23f;color:#1a0f2e;box-shadow:0 5px 0 #b8860b;flex:1;max-width:180px}
.pzbtn.g{background:#666;color:#eee;box-shadow:0 5px 0 #333}.pzbtn:disabled{opacity:.35}.pzbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8860b}
.pzshake{animation:pzsh .5s}
.pzconf{position:fixed;top:-20px;width:10px;height:14px;z-index:99;pointer-events:none;animation:pzfall linear forwards}
@keyframes pzfall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pzp{50%{transform:scale(1.15)}}@keyframes pzpop{50%{transform:scale(1.12)}}
@keyframes pzsh{0%,100%{transform:translate(0)}20%{transform:translate(-10px,6px)}40%{transform:translate(9px,-7px)}60%{transform:translate(-7px,-4px)}80%{transform:translate(6px,5px)}}

.pzc.flip{animation:pzflip var(--flip,.32s) ease-in-out}
@keyframes pzflip{0%{transform:perspective(300px) rotateY(90deg)}100%{transform:perspective(300px) rotateY(0)}}

.evov{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle,#000a,#000e);animation:evfade .25s}
.evburst{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(#ffd23f 0 10deg,#ff9f1a 10deg 20deg);opacity:.55;animation:evspin 4s linear infinite}
.evtenant .evburst{background:repeating-conic-gradient(#ff4fa3 0 10deg,#7a1d4a 10deg 20deg)}
.evimg{position:relative;width:min(62vw,260px);border-radius:16px;border:5px solid #111;box-shadow:0 0 0 4px #ffd23f,0 10px 0 #0009;animation:evin .55s cubic-bezier(.2,1.6,.4,1) both}
.evtenant .evimg{box-shadow:0 0 0 4px #ff4fa3,0 10px 0 #0009;animation:evpop .5s cubic-bezier(.2,1.6,.4,1) both}
.evtxt{position:relative;margin-top:-36px;font-size:104px;font-weight:900;line-height:.85;text-align:center;color:#ffd23f;text-shadow:5px 5px 0 #c2410c,10px 10px 0 #000;transform:rotate(-6deg);animation:evslam .5s .35s cubic-bezier(.2,1.8,.4,1) both,evwob .6s .9s ease-in-out infinite alternate}
.evtenant .evtxt{font-size:78px;color:#ff4fa3;text-shadow:4px 4px 0 #fff,9px 9px 0 #000}
.evsub{position:relative;margin-top:16px;max-width:320px;font-size:17px;font-weight:800;text-align:center;background:#000c;border:2px solid #ffb21a;border-radius:12px;padding:8px 12px;animation:evfade .3s .8s both}
@keyframes evfade{from{opacity:0}}@keyframes evspin{to{transform:rotate(360deg)}}
@keyframes evin{from{transform:translateX(-120vw) rotate(-25deg)}}
@keyframes evpop{from{transform:translateY(100vh) scale(.4)}}
@keyframes evslam{from{transform:scale(4) rotate(-6deg);opacity:0}}
@keyframes evwob{to{transform:scale(1.08) rotate(-2deg)}}

.evbonus .evburst{background:repeating-conic-gradient(#2ed573 0 10deg,#0b6b3a 10deg 20deg)}
.evbonus .rimg{width:min(40vw,150px)}
.evbonus .rtxt{font-size:60px;color:#2ed573;text-shadow:4px 4px 0 #0b3,8px 8px 0 #000;margin-top:-20px}
.rboxes{position:relative;display:flex;gap:14px;margin-top:14px}
.rbox{font-size:52px;width:90px;height:90px;border-radius:14px;border:4px solid #111;background:#c8873f;box-shadow:0 6px 0 #5a3410;cursor:pointer;animation:evwob .5s ease-in-out infinite alternate}
.rbox.open{background:#ffd23f;transform:scale(1.15);animation:none}.rbox.dim{opacity:.35;animation:none}
.pzcritter{position:absolute;left:0;z-index:20;pointer-events:none;animation:pzrun var(--run,1100ms) linear forwards}
.pzcritter img{width:84px;height:84px;object-fit:cover;border-radius:50%;border:3px solid #111;box-shadow:0 4px 0 #0008}
.pzcritter.roach img{width:64px;height:64px}
@keyframes pzrun{from{transform:translateX(-100px) rotate(-8deg)}25%{transform:translateX(calc(var(--bw)*.2)) rotate(8deg)}50%{transform:translateX(calc(var(--bw)*.45)) rotate(-8deg)}75%{transform:translateX(calc(var(--bw)*.7)) rotate(8deg)}to{transform:translateX(calc(var(--bw) + 20px)) rotate(-8deg)}}
.opp{display:none;gap:4px;margin-top:6px;flex-wrap:wrap}.opp.on{display:flex}.opp div{flex:1;min-width:80px;background:#000c;border:2px solid #111;border-radius:10px;padding:3px 6px;font-size:11px;font-weight:800;color:#ffd23f;text-align:left}
.opp div.me{border-color:#2ed573}.opp i{display:block;height:5px;background:#333;border-radius:3px;margin-top:2px}.opp i b{display:block;height:100%;background:#2ed573;border-radius:3px}
.inp{font:inherit;font-size:20px;font-weight:800;padding:10px;border-radius:12px;border:2px solid #ffb21a;background:#000;color:#ffd23f;width:100%;text-align:center;user-select:text;-webkit-user-select:text}
.btn.s{font-size:17px;padding:12px 18px;min-width:0}.btn.gr{background:#666;color:#eee;box-shadow:0 6px 0 #333}.code{font-size:40px;font-weight:900;letter-spacing:6px;color:#ffd23f}.cd{font-size:120px;font-weight:900;color:#ffd23f;text-shadow:6px 6px 0 #c2410c}
.tiers{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.tiers button{font:inherit;font-size:13px;font-weight:800;border-radius:10px;border:2px solid #111;padding:6px 8px;background:#333;color:#eee}.tiers button.on{background:#ffd23f;color:#1a0f2e}
</style></head><body><div id="app"><div id="hud"><span class="pill" id="hS">SCORE 0</span><span class="pill" id="hL">LVL 1</span><span class="pill" id="hB">BEST 0</span><button id="mute">🔊</button></div><div class="opp" id="opp"></div><div id="scr"></div></div>

// Unit ladder loader: level (1-200) -> image. Falls back to nearest available LOWER level, else lowest available.
var UNIT_LADDER=(function(){
 var MAX=200,avail=[],embedded={},base="units-ladder/";
 function pad(n){return ("00"+n).slice(-3);}
 function init(o){o=o||{};avail=(o.available||[]).slice().sort(function(a,b){return a-b;});embedded=o.embedded||{};if(o.base!=null)base=o.base;}
 function resolve(level){level=Math.max(1,Math.min(MAX,level|0));if(!avail.length)return null;var best=avail[0];for(var i=0;i<avail.length;i++){if(avail[i]<=level)best=avail[i];else break;}return best;}
 function src(level){var l=resolve(level);if(l==null)return "";return embedded[l]||(base+"unit"+pad(l)+".jpg");}
 function tierOf(level){return level<=20?1:level<=50?2:level<=90?3:level<=130?4:level<=170?5:level<=199?6:7;}

  ov.querySelectorAll(".rbox").forEach(function(o){o.disabled=true;if(o!==bx)o.classList.add("dim");});bx.classList.add("open");bx.textContent=p.ic;PZ.S.win();
  if(p.k==="cash")addScore(p.pts);else if(p.k==="time")perkTime+=C.bonusExtraSeconds;else perkPiece+=C.bonusFreePieces;
  ov.querySelector(".evsub").innerHTML='<b style="font-size:24px;color:#ffd23f">'+p.t+'</b><br>'+p.d+'<br><button class="btn" id="rgo" style="margin-top:10px">CONTINUE ▶</button>';
  $("rgo").onclick=function(){ov.remove();};};});}
function eventSplash(ev){var sold=ev.type==="sold",ov=document.createElement("div");ov.className="evov "+(sold?"evsold":"evtenant");
 ov.innerHTML='<div class="evburst"></div><img class="evimg" src="'+(sold?EVENT_IMGS.auctioneer:EVENT_IMGS.debbie)+'"><div class="evtxt">'+(sold?"SOLD!":"TENANT<br>PAID!")+'</div><div class="evsub">'+(sold?"The Auctioneer slams the gavel — unit "+unitNo()+" is YOURS!":"Debbie Deals: the tenant paid up. Unit "+unitNo()+" is off the block!")+'</div>';
 document.body.appendChild(ov);
 if(sold){PZ.S.win();if(window.PZ_MUTED!==true)setTimeout(PZ.S.win,450);}else PZ.S.bust();
 setTimeout(function(){ov.remove();
  if(sold){var pts=lvl*100;addScore(pts);var last=RACE&&lvl>=RACE.goal;
   scr.innerHTML='<div class="lockd">🔨</div><div class="big">SOLD TO YOU!</div><div class="box">The Auctioneer handed you unit '+unitNo()+'.<br>Level bonus: +'+pts+'</div><button class="btn" id="nx">'+(last?'FINISH 🏁':'NEXT UNIT ▶')+'</button>';
   $("nx").onclick=nextUnit;}
  else{score=lvlStartScore;var from=unitNo();lvl=Math.max(1,lvl-1);hud();saveCamp();
   scr.innerHTML='<div class="lockd">💸</div><div class="big red">TENANT PAID!</div><div class="box">Unit '+from+' was pulled from auction.<br>Back to '+(RACE?'round ':'level ')+lvl+'. Score: '+score+'</div><button class="btn" id="nx">BACK TO '+(RACE?'ROUND ':'UNIT ')+lvl+' ▶</button>';
   $("nx").onclick=function(){newLevel();play();};}if(RACE)raceProg(true);},2600);}
function over(){var nb=!RACE&&score>0&&score>=best;scr.innerHTML='<div class="lockd">💥</div><div class="big red">BUSTED!</div><div class="sub">Time ran out on unit '+unitNo()+'.</div><div class="box" style="text-align:center;font-size:22px">Score <b>'+score+'</b>'+(RACE?'<br>Retry — the race is still on!':'<br>Best <b>'+best+'</b><br>Best level reached <b>'+bestLvl+'</b>'+(nb?'<br>🏆 NEW BEST!':''))+'</div><button class="btn" id="re">RETRY '+(RACE?'ROUND ':'LEVEL ')+lvl+' ↻</button><button class="btn" id="so" style="background:#666;color:#eee;box-shadow:0 6px 0 #333;font-size:16px;padding:10px">'+(RACE?'QUIT RACE':'START OVER')+'</button>';
 $("re").onclick=function(){score=lvlStartScore;if(!PZ.CONFIG.sameBoardOnRetry&&!RACE)newLevel();else if(RACE)newLevel();play();};
 $("so").onclick=function(){if(!RACE){localStorage.removeItem("sas_camp");}title();};}
// ===== RACE mode: PeerJS (public PeerJS cloud broker), host is authority & clock =====
var NET={peer:null,conns:{},host:false,code:"",me:"",players:{},offset:0,winner:null,lobbyCb:null};
var RACE_GOAL=5,RACE_PREFIX="sas-scramble-race-";
function myName(){return (localStorage.getItem("sas_name")||"Pirate").slice(0,12);}
function loadPeer(cb){if(window.Peer)return cb(null);var s=document.createElement("script"),t=setTimeout(function(){cb("timeout");cb=function(){};},12000);
 s.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";s.onload=function(){clearTimeout(t);cb(window.Peer?null:"no Peer");cb=function(){};};s.onerror=function(){clearTimeout(t);cb("load failed");cb=function(){};};document.head.appendChild(s);}
function netFail(msg){netClose();scr.innerHTML='<div class="lockd">📡</div><div class="big red" style="font-size:30px">RACE UNAVAILABLE</div><div class="box">'+msg+'<br>SOLO still works fine.</div><button class="btn" id="so">SOLO / TITLE</button>';$("so").onclick=title;}
function netClose(){try{if(NET.peer)NET.peer.destroy();}catch(e){}NET.peer=null;NET.conns={};NET.players={};NET.winner=null;}
function endRace(){if(RACE){RACE=null;Math.random=NATIVE_RANDOM;}clearInterval(window.__raceIv);$("opp").classList.remove("on");$("opp").innerHTML="";netClose();}
function nameBox(){return '<input class="inp" id="nm" maxlength="12" value="'+myName().replace(/"/g,"")+'" placeholder="Your name">';}
function saveName(){var v=($("nm").value||"").trim()||"Pirate";localStorage.setItem("sas_name",v);return v.slice(0,12);}
function raceMenu(){scr.innerHTML='<div class="lockd">🏁</div><div class="big" style="font-size:36px">RACE</div><div class="sub">2-4 pirates · same units · same events · first to crack '+RACE_GOAL+' units wins</div>'+nameBox()+
 '<button class="btn" id="hostb">HOST A ROOM</button><input class="inp" id="jc" maxlength="5" placeholder="ROOM CODE" style="text-transform:uppercase"><button class="btn s" id="joinb">JOIN</button><button class="btn s gr" id="bk">BACK</button>';
 $("hostb").onclick=function(){saveName();hostRoom();};$("joinb").onclick=function(){var c=($("jc").value||"").trim().toUpperCase();if(c.length<4){$("jc").focus();return;}saveName();joinRoom(c);};$("bk").onclick=title;}
function joinMenu(c){scr.innerHTML='<div class="lockd">🏁</div><div class="big" style="font-size:32px">JOIN RACE</div><div class="code">'+c+'</div>'+nameBox()+'<button class="btn" id="joinb">JOIN ▶</button><button class="btn s gr" id="bk">SOLO INSTEAD</button>';
 $("joinb").onclick=function(){saveName();joinRoom(c);};$("bk").onclick=function(){history.replaceState(null,"",location.pathname);title();};}
function bcast(m){for(var k in NET.conns)try{NET.conns[k].send(m);}catch(e){}}
function plist(){var a=[];for(var k in NET.players)a.push(NET.players[k]);return a;}
function shareLink(){return location.origin+location.pathname+"?room="+NET.code;}
var RACE_TIER=0;
function lobby(){var ps=plist(),h=NET.host;
 scr.innerHTML='<div class="sub">ROOM CODE</div><div class="code" id="rc">'+NET.code+'</div>'+(h?'<div class="sub" style="font-size:12px;word-break:break-all;user-select:text;-webkit-user-select:text">'+shareLink()+'</div><button class="btn s" id="cp">📋 COPY / SHARE LINK</button>':'')+
 '<div class="box"><b>Players ('+ps.length+'/4)</b><br>'+ps.map(function(p){return (p.id===NET.me?'🟢 ':'⚓ ')+esc(p.name)+(p.host?' (host)':'');}).join("<br>")+'</div>'+
 (h?'<div class="sub">Unit tier</div><div class="tiers">'+["Any"].concat(UNIT_LADDER.TIERS.slice(1).map(function(t){return t[2];})).map(function(n,i){return '<button data-t="'+i+'" class="'+(i===RACE_TIER?"on":"")+'">'+n+'</button>';}).join("")+'</div><button class="btn" id="st" '+(ps.length<2?'disabled style="opacity:.5"':'')+'>START ▶</button>':'<div class="sub">Waiting for host to START…</div>')+
 '<button class="btn s gr" id="lv">LEAVE</button>';
 $("lv").onclick=title;
 if(h){$("cp").onclick=function(){var l=shareLink();if(navigator.share)navigator.share({title:"Storage Auction Scramble race",url:l}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(l).then(function(){$("cp").textContent="✅ COPIED";},function(){});};
  scr.querySelectorAll(".tiers button").forEach(function(b){b.onclick=function(){RACE_TIER=+b.dataset.t;lobby();};});
  $("st").onclick=function(){if(plist().length<2)return;hostStart();};}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function hostRoom(){scr.innerHTML='<div class="big" style="font-size:28px">Opening room…</div>';loadPeer(function(err){if(err)return netFail("Couldn't load networking ("+err+").");
 var A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",c="";for(var i=0;i<5;i++)c+=A[(NATIVE_RANDOM()*A.length)|0];
 NET.host=true;NET.code=c;var p=NET.peer=new Peer(RACE_PREFIX+c,{debug:0});
 p.on("open",function(id){NET.me=id;NET.players[id]={id:id,name:myName(),host:true,lvl:1,placed:0,total:0};lobby();});
 p.on("error",function(e){if(!RACE)netFail("Network error: "+(e.type||e));});
 p.on("connection",function(cn){cn.on("data",function(m){hostMsg(cn,m);});cn.on("close",function(){delete NET.conns[cn.peer];delete NET.players[cn.peer];hostSync();});});});}
function hostSync(){var ps=plist();bcast({t:"players",ps:ps});if(!RACE)lobby();else drawOpp();}
function hostMsg(cn,m){if(!m||!m.t)return;
 if(m.t==="ping"){cn.send({t:"pong",c:m.c,h:Date.now()});return;}
 if(m.t==="hello"){if(RACE||plist().length>=4){cn.send({t:"full",why:RACE?"Race already started":"Room is full (4 max)"});setTimeout(function(){cn.close();},500);return;}
  NET.conns[cn.peer]=cn;NET.players[cn.peer]={id:cn.peer,name:String(m.name||"Pirate").slice(0,12),lvl:1,placed:0,total:0};hostSync();return;}
 if(m.t==="prog"&&NET.players[cn.peer]){var p=NET.players[cn.peer];p.lvl=m.lvl;p.placed=m.placed;p.total=m.total;p.score=m.score;hostSync();return;}
 if(m.t==="done"){hostDone(cn.peer,m.ms,m.score);}}
function hostDone(id,ms,sc){var p=NET.players[id];if(!p)return;p.done=ms;p.score=sc;p.lvl=RACE_GOAL;if(!NET.winner){NET.winner={id:id,name:p.name,ms:ms,score:sc};bcast({t:"win",w:NET.winner});showWin();}hostSync();}
function hostStart(){var seed=((NATIVE_RANDOM()*4294967296)>>>0)||7,startAt=Date.now()+4000,m={t:"start",seed:seed,tier:RACE_TIER,goal:RACE_GOAL,startAt:startAt};bcast(m);beginRace(m,0);}
function joinRoom(c){scr.innerHTML='<div class="big" style="font-size:28px">Joining '+c+'…</div>';loadPeer(function(err){if(err)return netFail("Couldn't load networking ("+err+").");
 NET.host=false;NET.code=c;var p=NET.peer=new Peer({debug:0}),ok=false,tm=setTimeout(function(){if(!ok)netFail("Couldn't reach room "+c+". Check the code and that the host is still in the lobby.");},15000);
 p.on("error",function(e){if(!ok)netFail("Network error: "+(e.type||e));});
 p.on("open",function(id){NET.me=id;var cn=p.connect(RACE_PREFIX+c,{reliable:true});NET.conns.host=cn;
  cn.on("open",function(){ok=true;clearTimeout(tm);cn.send({t:"hello",name:myName()});var smp=[],n=0;
   (function pg(){if(n++<6){cn.send({t:"ping",c:Date.now()});setTimeout(pg,250);}})();
   NET.smp=smp;});
  cn.on("data",function(m){clientMsg(m);});
  cn.on("close",function(){if(RACE&&!NET.winner){$("opp").innerHTML+='<div>⚠ host left</div>';}else if(!RACE&&NET.peer)netFail("Host closed the room.");});});});}
function clientMsg(m){if(!m||!m.t)return;
 if(m.t==="pong"){var now=Date.now(),rtt=now-m.c;NET.smp.push({rtt:rtt,off:m.h-(m.c+rtt/2)});NET.smp.sort(function(a,b){return a.rtt-b.rtt;});NET.offset=NET.smp[0].off;return;}
 if(m.t==="players"){NET.players={};m.ps.forEach(function(p){NET.players[p.id]=p;});if(!RACE)lobby();else drawOpp();return;}
 if(m.t==="full"){netFail(m.why);return;}
 if(m.t==="start"){beginRace(m,NET.offset);return;}
 if(m.t==="win"){NET.winner=m.w;showWin();}}
function beginRace(m,off){var rnd=mulberry(m.seed^0x5A17),tr=UNIT_LADDER.TIERS[m.tier],lo=tr?tr[0]:1,hi=tr?tr[1]:200,units=[];
 for(var i=0;i<m.goal;i++)units.push(lo+((rnd()*(hi-lo+1))|0));
 RACE={seed:m.seed,goal:m.goal,units:units,att:{},startLocal:m.startAt-off,tier:m.tier};window.__race=RACE;NET.winner=null;
 score=0;lvl=1;perkTime=0;perkPiece=0;hud();$("opp").classList.add("on");drawOpp();
 (function cd(){if(!RACE)return;var left=RACE.startLocal-Date.now();if(left<=0){newLevel();play();return;}scr.innerHTML='<div class="sub">Race starts in</div><div class="cd">'+Math.ceil(left/1000)+'</div><div class="sub">Same '+m.goal+' units for everyone. Go fast, Pirate!</div>';setTimeout(cd,Math.min(100,left));})();
 clearInterval(window.__raceIv);window.__raceIv=setInterval(function(){raceProg(false);},500);}
var _lastProg="";
function raceProg(force){if(!RACE||NET.winner&&!force)return;var placed=0,total=0;try{var st=window.__pz&&__pz.state();if(st&&!st.done){total=st.cols*st.rows-1;for(var t=0;t<total;t++)if(st.pos[t]===t)placed++;}else if(st){total=st.cols*st.rows-1;placed=total;}}catch(e){}
 var m={t:"prog",lvl:lvl,placed:placed,total:total,score:score},k=JSON.stringify(m);if(k===_lastProg&&!force)return;_lastProg=k;
 if(NET.host){var p=NET.players[NET.me];if(p){p.lvl=lvl;p.placed=placed;p.total=total;p.score=score;hostSync();}}else{var me=NET.players[NET.me];if(me){me.lvl=lvl;me.placed=placed;me.total=total;}if(NET.conns.host)try{NET.conns.host.send(m);}catch(e){}drawOpp();}}
function drawOpp(){if(!RACE)return;var o=$("opp");o.innerHTML=plist().map(function(p){var pct=p.done?100:Math.round(100*((p.lvl-1)+(p.total?p.placed/p.total:0))/RACE.goal);
 return '<div class="'+(p.id===NET.me?"me":"")+'">'+esc(p.name)+' · '+(p.done?'🏁':'U'+p.lvl+'/'+RACE.goal+' · '+(p.placed||0)+'/'+(p.total||0))+'<i><b style="width:'+pct+'%"></b></i></div>';}).join("");}
function raceFinished(){var ms=Date.now()-RACE.startLocal;RACE.myMs=ms;scr.innerHTML='<div class="lockd">🏁</div><div class="big">FINISHED!</div><div class="sub">'+(ms/1000).toFixed(1)+'s · score '+score+'</div><div class="sub">Waiting for result…</div>';
 if(NET.host)hostDone(NET.me,ms,score);else{if(NET.conns.host)try{NET.conns.host.send({t:"done",ms:ms,score:score});}catch(e){}}}
function showWin(){if(!RACE)return;var w=NET.winner,me=w.id===NET.me;try{__pz&&__pz.stop();}catch(e){}document.querySelectorAll(".evov").forEach(function(e){e.remove();});
 Math.random=NATIVE_RANDOM;
 scr.innerHTML='<div class="lockd">'+(me?'🏆':'🏴‍☠️')+'</div><div class="big">'+(me?'YOU WIN!':'WINNER')+'</div><div class="code" style="font-size:30px;letter-spacing:1px">'+esc(w.name)+'</div><div class="sub">'+(w.ms/1000).toFixed(1)+'s · score '+w.score+'</div><div class="box">'+plist().map(function(p){return esc(p.name)+': '+(p.done?'🏁 '+(p.done/1000).toFixed(1)+'s':'unit '+p.lvl+'/'+RACE.goal);}).join("<br>")+'</div>'+(me?'':'')+'<button class="btn" id="so">'+'TITLE</button>';
 window.__raceWinner=w;$("so").onclick=title;if(me){PZ.S.win();}}

var _rm=(location.search.match(/[?&]room=([A-Z0-9]+)/i)||[])[1];if(_rm)joinMenu(_rm.toUpperCase());else title();
</script></body></html>
