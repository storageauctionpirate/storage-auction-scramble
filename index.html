<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f59e0b"><title>Unit Unlock</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#140c05;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);
background:linear-gradient(90deg,#0006,transparent 6%,transparent 94%,#0006),repeating-linear-gradient(180deg,#ffb21a 0,#ffcf3f 10px,#f59e0b 20px,#b86e00 24px,#5a3500 26px);border-left:10px solid #222;border-right:10px solid #222}
#hud{display:flex;justify-content:space-between;font-weight:900;gap:6px}.pill{background:#000c;border:2px solid #111;color:#ffd23f;border-radius:20px;padding:6px 12px;font-size:15px}
#mute{background:#000c;border:2px solid #111;border-radius:20px;font-size:18px;padding:2px 10px}
#scr{flex:1;margin-top:8px;background:#0b0603e6;border:3px solid #111;border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;overflow:hidden}
h1{font-size:58px;line-height:.9;color:#ffd23f;text-shadow:4px 4px 0 #c2410c,8px 8px 0 #000;transform:rotate(-3deg)}
.sub{font-size:16px;opacity:.9}.big{font-size:44px;font-weight:900;color:#ffd23f;text-shadow:3px 3px 0 #000}
.btn{font-family:inherit;font-weight:900;font-size:24px;border:none;border-radius:18px;padding:18px 30px;background:#ffd23f;color:#1a0f2e;box-shadow:0 6px 0 #b8860b;min-width:210px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
.box{background:#000a;border:2px solid #ffb21a;border-radius:14px;padding:12px;width:100%;font-size:16px;line-height:1.6;text-align:left}
.lockd{font-size:60px}.red{color:#ff4757}.thumbs{display:flex;gap:4px}.thumbs img{width:52px;height:52px;border-radius:6px;border:2px solid #111;filter:brightness(.5)}
.pz{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.pzbar{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:900;gap:6px}
.pzt{font-size:30px;color:#ffd23f;text-shadow:2px 2px 0 #000;min-width:80px;font-variant-numeric:tabular-nums}.pzt.hot{color:#ff4757;animation:pzp .5s infinite}
.pzinfo{white-space:nowrap;font-size:13px;background:#000a;border:2px solid #ffb21a;border-radius:10px;padding:4px 8px;color:#fff}
.pzb{position:relative;background:#1b1206;border:5px solid #111;border-radius:8px;box-shadow:0 0 0 3px #ffb21a,0 8px 0 #0008;touch-action:none;overflow:hidden}
.pzg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .15s;z-index:3;pointer-events:none}.pzb.peek .pzg{opacity:.45}
.pzc{position:absolute;border-radius:4px;transition:left .11s ease-out,top .11s ease-out;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px #0009;display:flex;align-items:center;justify-content:center;font-weight:900;color:#ffcf3f;text-shadow:1px 1px 0 #000;cursor:pointer}
.pzc.cov{background:repeating-linear-gradient(90deg,#5a3a14 0 6px,#6e4718 6px 12px,#4a2f0f 12px 13px)!important;border:2px solid #2b1a06;box-shadow:inset 0 0 0 2px #8a5a1e!important}
.pzc.cov::before,.pzc.cov::after{content:"";position:absolute;left:8%;right:8%;height:12%;background:#3a2509;top:12%}.pzc.cov::after{top:auto;bottom:12%}
.pzc span{position:relative;z-index:1}.pzc.ok{box-shadow:inset 0 0 0 2px #2ed57399}.pzc.pop{animation:pzpop .3s}
.pzrow{display:flex;gap:8px;width:100%;justify-content:center}
.pzbtn{font-family:inherit;font-weight:900;font-size:18px;border:none;border-radius:14px;padding:12px 16px;background:#ffd23f;color:#1a0f2e;box-shadow:0 5px 0 #b8860b;flex:1;max-width:180px}
.pzbtn.g{background:#666;color:#eee;box-shadow:0 5px 0 #333}.pzbtn:disabled{opacity:.35}.pzbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8860b}
.pzshake{animation:pzsh .5s}
.pzconf{position:fixed;top:-20px;width:10px;height:14px;z-index:99;pointer-events:none;animation:pzfall linear forwards}
@keyframes pzfall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pzp{50%{transform:scale(1.15)}}@keyframes pzpop{50%{transform:scale(1.12)}}
@keyframes pzsh{0%,100%{transform:translate(0)}20%{transform:translate(-10px,6px)}40%{transform:translate(9px,-7px)}60%{transform:translate(-7px,-4px)}80%{transform:translate(6px,5px)}}

var PZ=(function(){
var AC=null;function snd(f,d,type,vol,to){if(window.PZ_MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,AC.currentTime);if(to)o.frequency.exponentialRampToValueAtTime(Math.max(20,to),AC.currentTime+d);g.gain.setValueAtTime(vol||.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
var S={slide:function(){snd(180,.08,"triangle",.12,90);},lock:function(){snd(660,.09,"square",.07);setTimeout(function(){snd(990,.1,"square",.06);},70);},
tick:function(hi){snd(hi?1200:800,.04,"square",.06);},win:function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){snd(f,.18,"square",.09);},i*110);});},

// Difficulty: grid + timer escalate; peeks run out.
// Mike's timer ladder: 3x3 L1-6 30s→20s; 4x4 L7-12 90s→80s; 4x8 L13+ 180s -2s/level, floor 120s.
function cfg(L){var i;if(L<=6){i=L-1;return {c:3,r:3,t:30-2*i,m:16+4*i,p:[3,3,2,2,1,1][i]};}
if(L<=12){i=L-7;return {c:4,r:4,t:Math.max(70,90-2*i),m:36+6*i,p:[2,2,1,1,1,0][i]};}
i=L-13;return {c:4,r:8,t:Math.max(120,180-2*i),m:Math.min(150,70+5*i),p:i<3?1:0};}
function confetti(){var c=["#ffd23f","#ff4757","#2ed573","#4ea3ff","#ff9f1a"];for(var i=0;i<70;i++){var d=document.createElement("div");d.className="pzconf";d.style.left=Math.random()*100+"vw";d.style.background=c[i%5];d.style.animationDuration=(1.2+Math.random()*1.4)+"s";d.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(d);(function(d){setTimeout(function(){d.remove();},3300);})(d);}}
function shake(el){el.classList.remove("pzshake");void el.offsetWidth;el.classList.add("pzshake");}

function start(o){
 var C=cfg(o.level),cols=C.c,rows=C.r,N=cols*rows,cur=window.__pzOverrideTime||C.t;
 var pos=[],i;for(i=0;i<N;i++)pos.push(i);// pos[tile]=cell; tile N-1 is gap
 var gap=N-1,hint=0,peeks=C.p,done=false,moves=0;

 function nb(c){var a=[],x=c%cols,y=(c/cols)|0;if(x>0)a.push(c-1);if(x<cols-1)a.push(c+1);if(y>0)a.push(c-cols);if(y<rows-1)a.push(c+cols);return a;}

 function scramble(){for(var k=0;k<N;k++)pos[k]=k;var prev=-1;for(var s=0;s<C.m;s++){var gc=pos[gap],n=nb(gc).filter(function(c){return c!==prev;});var c=n[(Math.random()*n.length)|0];var t=tileAt(c);pos[t]=gc;pos[gap]=c;prev=gc;}}

 var maxW=o.maxW||340,maxH=o.maxH||420,tw=Math.floor(Math.min(maxW/cols,maxH/rows)),th=tw,W=tw*cols,H=th*rows;
